name: CodeQL Security Checks
on:
  push:
  workflow_dispatch:

concurrency:
  group: codeql-s-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql-build-scan:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - name: Install CodeQL
          run: |
            cd ../
            wget https://github.com/github/codeql-cli-binaries/releases/latest/download/codeql-linux64.zip
            unzip codeql-linux64.zip
        - name: Build Database
          run: |
            export PATH=$PATH:${GITHUB_WORKSPACE}/../codeql/
            ./codeql/build_db.sh
        - name: Create Report
          run: |
            export PATH=$PATH:${GITHUB_WORKSPACE}/../codeql/
            ./codeql/create_codeql_report.sh
        - name: Analyze Reports - Pass or Fail Build
          run: |
            cd codeql/sarif_reporter/
            npm install
            npm run compile
            cat ../../codeql-ruby.sarif | npm run-script run -- --ignore-file=../ignore.yaml
            cat ../../codeql-js.sarif | npm run-script run -- --ignore-file=../ignore.yaml
        - name: Upload Ruby SARIF
          uses: github/codeql-action/upload-sarif@v3
          with:
            sarif_file: codeql-ruby.sarif
            category: ruby
        - name: Upload JavaScript SARIF
          uses: github/codeql-action/upload-sarif@v3
          with:
            sarif_file: codeql-js.sarif
            category: javascript

